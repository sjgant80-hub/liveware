name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                  # the measurement finds the commit that sealed its claims
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: the kernels — unit, edge and garbage suites
        run: node --test test/*.test.mjs
      - name: the mutation gate — every mutant of every kernel caught by its tests (seed carries a reviewed baseline)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness6
          for k in receipt rng compress seed door mesh t11 mintcase; do
            node /tmp/witness6/witness.mjs mutate src/$k.mjs --timeout 180000 --cap 800 --test node --test test/$k.test.mjs | tee /tmp/w-$k.txt
            grep -q '"clean": true' /tmp/w-$k.txt || { echo "::error::mutants survived in src/$k.mjs"; exit 1; }
          done
      - name: the gate receipt — the blueprint's test and mutant counts re-derive from this run's witness output
        run: node tools/gate-receipt.mjs --from /tmp --check
      - name: the four receipts re-derive byte for byte from the sealed claims and the committed samples
        run: node tools/measure.mjs --check
      - name: T11 — the guarantee's three committed runs re-derive from their recorded replies, every receipt is attacked, nothing is typed into the page
        run: node tools/measure-t11.mjs --check
